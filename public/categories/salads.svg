<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 100" fill="none" viewBox="0 0 110 100" fill="none"  >
      <defs>
        <filter id="shadow-salad" x="-10%" y="-10%" width="120%" height="130%">
          <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#17110d" flood-opacity="0.25" />
        </filter>
      </defs>
      <g filter="url(#shadow-salad)">
        <ellipse cx="55" cy="88" rx="40" ry="7" fill="#17110d" opacity="0.2" />
        {/* Ceramic Salad Bowl */}
        <ellipse cx="55" cy="74" rx="42" ry="16" fill="#fbf6f0" stroke="#e8700a" stroke-width="1.5" />
        {/* Crispy Greens & Lettuce Bed */}
        <ellipse cx="55" cy="68" rx="36" ry="14" fill="#16a34a" />
        <ellipse cx="55" cy="66" rx="30" ry="11" fill="#22c55e" />
        {/* Cherry Tomatoes */}
        <circle cx="40" cy="62" r="5" fill="#dc2626" />
        <circle cx="70" cy="64" r="5.5" fill="#dc2626" />
        <circle cx="54" cy="58" r="4.5" fill="#ef4444" />
        {/* Cucumber Slices */}
        <circle cx="46" cy="68" r="6" fill="#86efac" stroke="#16a34a" stroke-width="1.5" />
        <circle cx="64" cy="68" r="6" fill="#86efac" stroke="#16a34a" stroke-width="1.5" />
        {/* Danish Feta Cheese Cubes */}
        <rect x="36" y="54" width="6" height="6" rx="1" fill="#fffdfa" stroke="#e5e7eb" stroke-width="0.8" />
        <rect x="62" y="56" width="6" height="6" rx="1" fill="#fffdfa" stroke="#e5e7eb" stroke-width="0.8" />
        {/* Kalamata Olives */}
        <ellipse cx="52" cy="67" rx="3" ry="4" fill="#312e81" />
      </g>
    </svg>
